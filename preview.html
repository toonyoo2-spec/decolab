<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description" content="선택하신 업종 샘플의 스타일 미리보기입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- ==================== HEADER ==================== -->
<header class="site-header">
  <a href="index.html" class="site-header__logo" aria-label="디자인코드랩 홈으로">
    <img src="assets/img/logo-header.png" alt="디자인코드랩 DESIGN CODE LAB">
  </a>
  <nav class="site-nav" id="siteNav">
    <a href="index.html#samples">샘플</a>
    <a href="index.html#differentiation">차이점</a>
    <a href="index.html#method">적용 방식</a>
    <a href="index.html#process">제작 절차</a>
    <a href="index.html#faq">FAQ</a>
    <a href="order.html">주문 조회</a>
  </nav>
  <div class="site-header__actions">
    <button type="button" class="btn btn--primary btn--sm js-consult-open">상담 신청</button>
    <button class="nav-toggle" id="navToggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="siteNav">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<!-- ==================== 샘플 미리보기 ==================== -->
<section class="preview-page">
  <div class="preview-page__hero" id="previewHero">
    <span class="preview-page__tag" id="previewTag"></span>
  </div>
  <div class="preview-page__body">
    <h1 class="preview-page__title" id="previewTitle"></h1>
    <p class="preview-page__note">실제 미리보기 페이지는 준비 중입니다. 선택하신 샘플과 같은 스타일·구조로 제작해드립니다.</p>
    <div class="preview-page__actions">
      <a href="https://smartstore.naver.com/designcodelab/products/13725448695" target="_blank" rel="noopener" class="btn btn--primary">제작하기</a>
      <a href="index.html#samples" class="btn btn--outline">다른 샘플 보기</a>
    </div>
  </div>
</section>

<!-- ==================== FOOTER ==================== -->
<footer class="site-footer">
  <div class="site-footer__top">
    <div class="site-footer__brand">
      <span class="site-footer__mark">L</span>
      <div>
        <p class="site-footer__brand-name">디자인코드랩</p>
        <p class="site-footer__brand-tagline">저비용 고효율 홈페이지 제작 서비스</p>
      </div>
    </div>
    <div>
      <p class="site-footer__desc-title">디자인코드랩</p>
      <p class="site-footer__desc-text">검색 노출 최적화 랜딩페이지 제작</p>
    </div>
    <nav class="site-footer__links">
      <a href="index.html#samples">샘플</a>
      <a href="index.html#differentiation">차이점</a>
      <a href="index.html#method">적용 방식</a>
      <a href="index.html#process">제작 절차</a>
      <a href="index.html#faq">FAQ</a>
      <a href="order.html">주문 조회</a>
    </nav>
  </div>
  <div class="site-footer__divider"></div>
  <p class="site-footer__bottom">본 페이지와 업종별 화면은 제작 구조를 확인하기 위한 샘플입니다.</p>
</footer>

<!-- ==================== 상담 신청 팝업 ==================== -->
<div class="consult-modal" id="consultModal" aria-hidden="true">
  <div class="consult-modal__overlay" data-consult-close></div>
  <div class="consult-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="consultModalTitle" tabindex="-1">
    <button class="consult-modal__close" type="button" data-consult-close aria-label="닫기">&times;</button>
    <h3 class="consult-modal__title" id="consultModalTitle">상담 신청</h3>
    <p class="consult-modal__desc">문의 내용을 남겨주시면 빠르게 연락드리겠습니다.</p>
    <form class="consult-modal__form" id="consultForm">
      <label class="order-login__field">
        <span>제목</span>
        <input type="text" name="subject" placeholder="문의 제목을 입력하세요" required>
      </label>
      <label class="order-login__field">
        <span>성함</span>
        <input type="text" name="name" placeholder="이름을 입력하세요" required>
      </label>
      <label class="order-login__field">
        <span>연락처</span>
        <input type="tel" name="phone" placeholder="연락 가능한 전화번호" required>
      </label>
      <label class="order-login__field">
        <span>내용</span>
        <textarea name="message" rows="5" placeholder="문의하실 내용을 자유롭게 남겨주세요" required></textarea>
      </label>
      <button type="submit" class="btn btn--primary consult-modal__submit">문의 보내기</button>
      <p class="consult-modal__status" id="consultFormStatus" role="status" aria-live="polite"></p>
    </form>
  </div>
</div>

<script src="assets/js/main.js"></script>
</body>
</html>
